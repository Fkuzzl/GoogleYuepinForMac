name: macOS validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Run core tests
        run: swift test

      - name: Validate Mac scripts
        run: |
          /bin/zsh -n Scripts/build-local.sh
          /bin/zsh -n Scripts/test-on-mac.sh
          /bin/zsh -n Scripts/install-local.sh
          /bin/zsh -n Scripts/prepare-icon.sh

      - name: Build InputMethodKit application without private signing credentials
        run: |
          user_temp="${TMPDIR:-/private/tmp}"
          derived_data="${user_temp%/}/GoogleYuepinForMacDerivedData"
          xcodebuild \
            -project GoogleYuepinForMac.xcodeproj \
            -scheme GoogleYuepinForMac \
            -configuration Release \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            GENERATE_PKGINFO_FILE=YES \
            build

      - name: Verify built metadata
        run: |
          user_temp="${TMPDIR:-/private/tmp}"
          app="${user_temp%/}/GoogleYuepinForMacDerivedData/Build/Products/Release/GoogleYuepinForMac.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :TISIntendedLanguage' "$app/Contents/Info.plist")" = "yue-Hant"
          test "$(/usr/libexec/PlistBuddy -c 'Print :TISInputSourceID' "$app/Contents/Info.plist")" = "local.googleyuepinformac.inputmethod"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist")" = "true"
          test -f "$app/Contents/Resources/InputSourceIcon.png"
          test -f "$app/Contents/PkgInfo"
